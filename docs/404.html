<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Trasy 2.0 — przekierowanie</title>
</head>
<body>
  <p>Przenoszenie do Trasy 2.0…</p>
  <script>
    (() => {
      const sourceBase = '/Trasy-2.0';
      const path = location.pathname.startsWith(sourceBase)
        ? location.pathname.slice(sourceBase.length) || '/'
        : '/';
      location.replace(`https://trasy.tyli.pl${path}${location.search}${location.hash}`);
    })();
  </script>
</body>
</html>
