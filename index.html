<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#1a1a1a">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css?v=i18n-1">
  <link rel="stylesheet" href="./navigation.css?v=4">
  <style>
    #routeMapCanvas .maplibregl-marker[style*="clip-path"]{border:0!important;width:39px!important;height:39px!important;filter:drop-shadow(0 0 1.8px #000) drop-shadow(0 0 1.4px #000) drop-shadow(0 2px 5px #000b)!important}
    html[data-nav-punctuality="early"] #routeMapCanvas .maplibregl-marker[style*="clip-path"]{background:#ff3b30!important}
    html[data-nav-punctuality="late"] #routeMapCanvas .maplibregl-marker[style*="clip-path"]{background:#ff9500!important}
    html[data-nav-punctuality="onTime"] #routeMapCanvas .maplibregl-marker[style*="clip-path"],html[data-nav-punctuality="arrived"] #routeMapCanvas .maplibregl-marker[style*="clip-path"]{background:#34c759!important}
    #scheduleBody tr.gpsNextStop{background:rgba(255,255,255,.045)!important;box-shadow:inset 5px 0 0 var(--gps-status-color,#ccff33)!important;transition:background-color .28s ease,box-shadow .28s ease!important}
    #scheduleBody .etaPunctuality{white-space:normal!important;max-width:none!important;color:#39ff69!important}
    #scheduleBody .etaPunctualityText{display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;min-width:max-content!important;white-space:nowrap!important;font:inherit!important;color:inherit!important;letter-spacing:inherit!important}
    #scheduleBody .etaPunctualityTime,#scheduleBody .etaPunctualityLabel{display:block!important;white-space:nowrap!important;word-break:keep-all!important;overflow-wrap:normal!important;font:inherit!important;color:inherit!important;letter-spacing:inherit!important;text-transform:inherit!important}
    #scheduleBody .etaPunctuality:before{transition:background-color .28s ease!important;box-shadow:none!important}
    #scheduleBody .etaPunctuality.early:before{background:#ff3b30!important}
    #scheduleBody .etaPunctuality.late:before{background:#ff9500!important}
    #scheduleBody .etaPunctuality.onTime:before,#scheduleBody .etaPunctuality.arrived:before{background:#34c759!important}
    #routeNextStop .nextStopStatus:before{box-shadow:none!important}
    #routeNextStop .nextStopStatus.early:before{background:#ff3b30!important}
    #routeNextStop .nextStopStatus.late:before{background:#ff9500!important}
    #routeNextStop .nextStopStatus.onTime:before{background:#34c759!important}
    #scheduleBody tr.isActiveStop:not(.gpsNextStop){background:transparent!important;box-shadow:none!important;transform:scale(.955)!important;opacity:.74!important}
    #scheduleBody tr.isActiveStop:not(.gpsNextStop) td{padding:10px 8px!important;font-weight:inherit!important;border-bottom-color:#444!important}
    #scheduleBody tr.isActiveStop:not(.gpsNextStop) td:first-child{padding-left:8px!important;font-size:inherit!important;font-weight:inherit!important}
    #scheduleBody tr.isActiveStop:not(.gpsNextStop) td:first-child::before{display:none!important;content:none!important}

    /* Nawigacja: półprzezroczyste, szare komunikaty z widoczną mapą pod spodem. */
    #routeNavRoot .routeNavInfoShell{background:rgba(68,68,68,.55)!important;border-bottom-color:rgba(255,255,255,.28)!important}
    #routeManeuverBubble{background:transparent!important;border-color:transparent!important;box-shadow:none!important;-webkit-backdrop-filter:none;backdrop-filter:none}
    .routeModeNotice{background:rgba(68,68,68,.55)!important;box-shadow:0 7px 24px #0008!important;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}

    /* Czytelniejszy nagłówek następnego przystanku. */
    #routeNextStop{max-width:100%!important;font-size:16px!important;line-height:1.24!important}
    #routeNextStop .nextStopLabel{font-size:11px!important;line-height:1.1!important}
    #routeNextStop .nextStopMain{font-size:19px!important;line-height:1.12!important;font-weight:1000!important}
    #routeNextStop .nextStopPlan{min-height:17px!important;margin-top:2px!important;font-size:14px!important;line-height:17px!important}
    #routeNextStop .nextStopStatus{gap:9px!important;margin-top:4px!important;font-size:18px!important;line-height:1.15!important}
    #routeNextStop .nextStopStatus:before{width:18px!important;height:18px!important;flex:0 0 18px!important}
    #routeNextStop .nextStopGuard{font-size:17px!important;line-height:1.15!important}

    /* Jednolity, geometryczny chevron zamiast znaku tekstowego ‹. */
    #routeMapClose,#backFromSchedule{font-size:0!important;line-height:0!important;background:rgba(68,68,68,.62)!important;border-color:rgba(255,255,255,.55)!important;box-shadow:0 2px 8px #0007!important}
    #routeMapClose::before,#backFromSchedule::before{content:"";display:block;width:13px;height:13px;box-sizing:border-box;border-left:3px solid currentColor;border-bottom:3px solid currentColor;border-radius:1px;transform:rotate(45deg);margin-left:4px}
  </style>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.css">
  <link rel="preconnect" href="https://vectormaps-resources.myptv.com" crossorigin>
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
  <title>Trasy 2.0</title>
</head>
<body data-test-diagnostics="enabled">
  <div id="globalTestVersion" data-version="2.0.205">TEST 2.0.205</div>
  <header class="header"><div class="headerActions"><span id="connectionStatus" class="status">Offline</span></div></header>
  <main class="container">
    <aside id="updateNotice" class="notice updateNotice" hidden><span>Nowa wersja aplikacji jest gotowa.</span><button id="updateAppButton">ODŚWIEŻ</button></aside>
    <aside id="staleWarning" class="notice staleWarning" hidden>Sprawdź działanie programu. Nie masz połączenia z bazą danych od ponad 3 dni.</aside>
    <section id="selectionView" class="panel view">
      <h1>Wybierz trasę</h1>
      <label>Trasa</label>
      <select id="routeSelect"><option value="">Wybierz trasę</option></select>
      <button id="showSchedule" class="primary">POKAŻ HARMONOGRAM</button>
      <p id="formMessage" class="message"></p>
      <button id="languageButton" class="languageButton" type="button" aria-label="Język aplikacji"><span class="languageButtonIcon" aria-hidden="true">🌐</span><span>Język aplikacji</span></button>
      <button id="diagnosticButton" class="diagnosticButton" type="button"><span aria-hidden="true">●</span><span>DIAGNOSTYKA TESTÓW</span></button>
    </section>
    <section id="scheduleView" class="panel view" hidden>
      <div class="viewHeading scheduleHeading">
        <div class="scheduleBackStack">
          <button id="backFromSchedule" class="secondary" aria-label="Wróć" title="Wróć">‹</button>
          <button id="wakeLockButton" class="wakeLockButton" type="button" aria-label="Blokada wygaszania ekranu"><span class="wakeBulb">💡</span><span id="wakeLockLabel">EKRAN OFF</span></button>
        </div>
        <div class="scheduleTitleBlock">
          <h1 id="scheduleRouteName"></h1>
          <div class="scheduleControls">
            <select id="scheduleTimeSelect" class="scheduleTimeSelect" aria-label="Godzina kursu"></select>
            <span id="scheduleClock" class="scheduleClock" aria-label="Aktualna godzina">🕒 --:--</span>
          </div>
        </div>
      </div>
      <div class="tableWrap"><table><thead><tr><th>Przystanek</th><th>Godzina</th><th>Trasa</th></tr></thead><tbody id="scheduleBody"></tbody></table></div>
    </section>
  </main>
  <div id="installBanner" class="installBanner" hidden><strong>Chcesz zainstalować aplikację TRASY 2.0?</strong><div class="installActions"><button id="installButton" class="installButton">ZAINSTALUJ</button><button id="rejectInstall" class="rejectButton">ODRZUĆ</button></div></div>
  <script src="./i18n.js?v=2"></script>
  <script src="./time-core.js?v=3"></script>
  <script src="./geo-core.js?v=1"></script>
  <script src="./eta-core.js?v=3"></script>
  <script src="./route-data-service.js?v=5"></script>
  <script src="./gps-hub.js?v=resume-1"></script>
  <script src="./diagnostic-recorder.js?v=5"></script>
  <script type="module" src="./app.js?v=active-course-1"></script>
  <script src="./wake-style.js?v=navigation-wake-3"></script>
  <script src="./offline-map-cache.js?v=1"></script>
  <script src="./offline-route-cache.js?v=1"></script>
  <script src="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.js"></script>
  <script type="module" src="./map-runtime.js?v=2"></script>
  <script src="./vehicles.js?v=sheet-data-2"></script>
  <script src="./return-route.js?v=pinned-course-1"></script>
  <script src="./speed-display.js?v=map-left-bottom-1"></script>
  <script type="module" src="./road-speed-limit.js?v=osm-only-1"></script>
  <script type="module" src="./gps-stop-tracker.js?v=first-stop-1"></script>
  <script src="./active-stop-guard.js?v=1"></script>
  <script src="./google-routes-provider.js?v=handled-fallback-1"></script>
  <script src="./route-renderer-bridge.js?v=2"></script>
  <script src="./nav-map.js?v=fresh-resume-1"></script>
  <script src="./guidance-text-fix.js?v=1"></script>
  <script src="./return-navigation-origin-fix.js?v=2"></script>
  <script src="./maneuver-bubble.js?v=3"></script>
  <script type="module" src="./route-progress-style.js?v=11"></script>
  <script src="./traffic-delay-ui.js?v=duration-hours-1"></script>
  <script src="./navigation-ui-controls.js?v=left-stack-1"></script>
  <script src="./navigation-compass.js?v=3"></script>
  <script type="module" src="./navigation-live-engine.js?v=6"></script>
  <script src="./navigation-feedback.js?v=i18n-1"></script>
  <script src="./android-back-navigation.js?v=2"></script>
  <script src="./etoll-overlay.js?v=2"></script>
  <script src="./skip-stop-control.js?v=5"></script>
  <script src="./final-stop-ui.js?v=4"></script>
  <script src="./stop-map-links.js?v=1"></script>
  <script type="module" src="./eta-status.js?v=status-sync-2"></script>
  <script src="./next-stop-header.js?v=status-14"></script>
  <script src="./visual-stop-alert.js?v=2"></script>
  <script src="./navigation-layout-fix.js?v=5"></script>
</body>
</html>
