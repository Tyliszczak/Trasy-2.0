<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#123a5a">
    <meta name="description" content="Rozkłady tras pracowniczych">
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./style.css">
    <title>Trasy 2.0</title>
  </head>
  <body>
    <header class="header">
      <div>
        <p class="eyebrow">Portal kierowcy</p>
        <h1>Trasy 2.0</h1>
      </div>
      <span id="connectionStatus" class="status" aria-live="polite">Dane lokalne</span>
    </header>

    <main class="container">
      <section class="card" aria-labelledby="selectionTitle">
        <h2 id="selectionTitle">Znajdź rozkład</h2>
        <p class="hint">Wybierz trasę oraz godzinę rozpoczęcia zmiany.</p>
        <div class="fields">
          <label>
            Trasa
            <select id="routeSelect">
              <option value="">Wybierz trasę</option>
            </select>
          </label>
          <label>
            Godzina zmiany
            <select id="timeSelect" disabled>
              <option value="">Najpierw wybierz trasę</option>
            </select>
          </label>
        </div>
        <button id="showSchedule" type="button">Pokaż harmonogram</button>
        <p id="formMessage" class="message" aria-live="polite"></p>
      </section>

      <section id="schedule" class="card schedule" hidden aria-live="polite">
        <div class="scheduleHeading">
          <div>
            <p class="eyebrow">Rozkład</p>
            <h2 id="scheduleTitle"></h2>
          </div>
          <button id="clearSchedule" class="secondary" type="button">Zmień wybór</button>
        </div>
        <div class="tableWrap">
          <table>
            <thead><tr><th>Przystanek</th><th>Godzina</th><th>Mapa</th></tr></thead>
            <tbody id="scheduleBody"></tbody>
          </table>
        </div>
      </section>
    </main>
    <footer>Rozkład działa offline po pierwszym otwarciu aplikacji.</footer>
    <script type="module" src="./app.js?v=5c4b19e"></script>
  </body>
</html>
