<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ccff33">
    <meta name="description" content="Rozkłady tras pracowniczych">
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./style.css">
    <title>Trasy 2.0</title>
  </head>
  <body>
    <header class="appHeader">
      <button id="wakeLockButton" class="wakeLock" type="button" aria-pressed="false" aria-label="Włącz utrzymywanie ekranu">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 21h6M10 17h4M8.5 14.5A6 6 0 1 1 15.5 14.5C14.5 15.3 14 16 14 17h-4c0-1-.5-1.7-1.5-2.5Z"/>
        </svg>
        <span id="wakeLockStatus">OFF</span>
        <small>EKRAN</small>
      </button>
      <div class="brand">
        <p>TRASY 2.0</p>
        <h1>PORTAL KIEROWCY</h1>
      </div>
      <span id="connectionStatus" class="status" aria-live="polite">Dane lokalne</span>
    </header>

    <main class="container">
      <aside id="updateNotice" class="updateNotice" hidden aria-live="polite">
        <span>Nowa wersja aplikacji jest gotowa.</span>
        <button id="updateAppButton" type="button">Odśwież teraz</button>
      </aside>
      <section id="selectionPanel" class="selectionPanel" aria-labelledby="selectionTitle">
        <h2 id="selectionTitle" class="visuallyHidden">Znajdź rozkład</h2>
        <div class="fields">
          <label>
            <span class="visuallyHidden">Trasa</span>
            <select id="routeSelect">
              <option value="">WYBIERZ TRASĘ...</option>
            </select>
          </label>
          <label>
            <span class="visuallyHidden">Godzina zmiany</span>
            <select id="timeSelect" disabled>
              <option value="">WYBIERZ GODZINĘ...</option>
            </select>
          </label>
        </div>
        <button id="showSchedule" class="primaryAction" type="button">POKAŻ HARMONOGRAM</button>
        <p id="formMessage" class="message" aria-live="polite"></p>
      </section>

      <section id="schedule" class="schedule" hidden aria-live="polite">
        <div class="scheduleHeading">
          <button id="clearSchedule" class="backButton" type="button" aria-label="Wróć do wyboru trasy">← <span>WRÓĆ</span></button>
          <div class="scheduleTitleGroup">
            <h2 id="scheduleTitle">Wybrana trasa</h2>
            <span id="scheduleTime" class="timeBadge"></span>
          </div>
          <div class="clock" role="timer" aria-label="Aktualna godzina">
            <strong id="currentClock">--:--:--</strong>
            <span>TERAZ</span>
          </div>
        </div>
        <div class="tableWrap">
          <table>
            <thead class="visuallyHidden"><tr><th>Przystanek</th><th>Godzina</th><th>Mapa</th></tr></thead>
            <tbody id="scheduleBody"></tbody>
          </table>
        </div>
      </section>
    </main>
    <footer>Dane tras są dostępne offline po pierwszym otwarciu.</footer>
    <script type="module" src="./app.js?v=portal-layout-1"></script>
  </body>
</html>
