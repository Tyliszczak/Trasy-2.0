<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#1a1a1a">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css?v=i18n-1">
  <link rel="stylesheet" href="./navigation.css?v=2">
  <style>
    #routeMapCanvas .maplibregl-marker[style*="clip-path"]{border:0!important;width:39px!important;height:39px!important;filter:drop-shadow(0 0 1.4px #fff) drop-shadow(0 0 1.2px #fff) drop-shadow(0 2px 5px #000b)!important}
    #scheduleBody tr.gpsNextStop{background:rgba(255,255,255,.045)!important;box-shadow:inset 5px 0 0 var(--gps-status-color,#ccff33),inset 0 0 0 1px #ffffff16!important;transition:background-color .28s ease,box-shadow .28s ease!important}
    #scheduleBody .etaPunctuality:before{transition:background-color .28s ease,box-shadow .28s ease!important}
    #scheduleBody tr.isActiveStop:not(.gpsNextStop){background:transparent!important;box-shadow:none!important;transform:scale(.955)!important;opacity:.74!important}
    #scheduleBody tr.isActiveStop:not(.gpsNextStop) td{padding:10px 8px!important;font-weight:inherit!important;border-bottom-color:#444!important}
    #scheduleBody tr.isActiveStop:not(.gpsNextStop) td:first-child{padding-left:8px!important;font-size:inherit!important;font-weight:inherit!important}
    #scheduleBody tr.isActiveStop:not(.gpsNextStop) td:first-child::before{display:none!important;content:none!important}
    #routeMapClose{top:112px!important}
    #routeMapCenter{top:110px!important;right:12px!important}
    #routeVoiceToggle{top:112px!important;right:62px!important}
  </style>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.css">
  <link rel="preconnect" href="https://vectormaps-resources.myptv.com" crossorigin>
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
  <title>Trasy 2.0</title>
</head>
<body>
  <div id="globalTestVersion" data-version="2.0.174">TEST 2.0.174</div>
  <header class="header"><div class="headerActions"><span id="connectionStatus" class="status">Offline</span></div></header>
  <main class="container">
    <aside id="updateNotice" class="notice updateNotice" hidden><span>Nowa wersja aplikacji jest gotowa.</span><button id="updateAppButton">ODŚWIEŻ</button></aside>
    <aside id="staleWarning" class="notice staleWarning" hidden>Sprawdź działanie programu. Nie masz połączenia z bazą danych od ponad 3 dni.</aside>
    <section id="selectionView" class="panel view">
      <h1>Wybierz trasę</h1>
      <label>Trasa</label>
      <select id="routeSelect"><option value="">Wybierz trasę</option></select>
      <button id="showSchedule" class="primary">POKAŻ HARMONOGRAM</button>
      <p id="formMessage" class="message"></p>
      <button id="languageButton" class="languageButton" type="button" aria-label="Język aplikacji"><span class="languageButtonIcon" aria-hidden="true">🌐</span><span>Język aplikacji</span></button>
    </section>
    <section id="scheduleView" class="panel view" hidden>
      <div class="viewHeading scheduleHeading">
        <div class="scheduleBackStack">
          <button id="backFromSchedule" class="secondary" aria-label="Wróć" title="Wróć">‹</button>
          <button id="wakeLockButton" class="wakeLockButton" type="button" aria-label="Blokada wygaszania ekranu"><span class="wakeBulb">💡</span><span id="wakeLockLabel">EKRAN OFF</span></button>
        </div>
        <div class="scheduleTitleBlock">
          <h1 id="scheduleRouteName"></h1>
          <div class="scheduleControls">
            <select id="scheduleTimeSelect" class="scheduleTimeSelect" aria-label="Godzina kursu"></select>
            <span id="scheduleClock" class="scheduleClock" aria-label="Aktualna godzina">🕒 --:--</span>
          </div>
        </div>
      </div>
      <div class="tableWrap"><table><thead><tr><th>Przystanek</th><th>Godzina</th><th>Trasa</th></tr></thead><tbody id="scheduleBody"></tbody></table></div>
    </section>
  </main>
  <div id="installBanner" class="installBanner" hidden><strong>Chcesz zainstalować aplikację TRASY 2.0?</strong><div class="installActions"><button id="installButton" class="installButton">ZAINSTALUJ</button><button id="rejectInstall" class="rejectButton">ODRZUĆ</button></div></div>
  <script src="./i18n.js?v=2"></script>
  <script src="./time-core.js?v=3"></script>
  <script src="./geo-core.js?v=1"></script>
  <script src="./eta-core.js?v=1"></script>
  <script src="./route-data-service.js?v=5"></script>
  <script src="./gps-hub.js?v=resume-1"></script>
  <script type="module" src="./app.js?v=secure-data-4"></script>
  <script src="./wake-style.js?v=navigation-wake-3"></script>
  <script src="./offline-map-cache.js?v=1"></script>
  <script src="./offline-route-cache.js?v=1"></script>
  <script src="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.js"></script>
  <script type="module" src="./map-runtime.js?v=2"></script>
  <script src="./vehicles.js?v=sheet-data-2"></script>
  <script src="./return-route.js?v=parking-notice-1"></script>
  <script src="./speed-display.js?v=road-only-1"></script>
  <script type="module" src="./road-speed-limit.js?v=osm-only-1"></script>
  <script type="module" src="./gps-stop-tracker.js?v=stop-engine-12"></script>
  <script src="./active-stop-guard.js?v=1"></script>
  <script src="./google-routes-provider.js?v=secure-api-1"></script>
  <script src="./nav-map.js?v=i18n-1"></script>
  <script src="./maneuver-bubble.js?v=3"></script>
  <script type="module" src="./route-progress-style.js?v=6"></script>
  <script src="./traffic-delay-ui.js?v=1"></script>
  <script src="./navigation-ui-controls.js?v=27"></script>
  <script src="./navigation-compass.js?v=2"></script>
  <script type="module" src="./navigation-live-engine.js?v=6"></script>
  <script src="./navigation-feedback.js?v=i18n-1"></script>
  <script src="./android-back-navigation.js?v=2"></script>
  <script src="./etoll-overlay.js?v=2"></script>
  <script src="./skip-stop-control.js?v=5"></script>
  <script src="./skip-detection.js?v=resume-validation-1"></script>
  <script src="./final-stop-ui.js?v=4"></script>
  <script src="./stop-map-links.js?v=1"></script>
  <script type="module" src="./eta-status.js?v=status-9"></script>
  <script src="./next-stop-header.js?v=status-13"></script>
  <script src="./visual-stop-alert.js?v=1"></script>
</body>
</html>
