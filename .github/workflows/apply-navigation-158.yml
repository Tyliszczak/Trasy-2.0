name: Apply navigation 2.0.158 fix

on:
  push:
    paths:
      - '.github/workflows/apply-navigation-158.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused navigation fixes
        run: python3 .github/scripts/apply_navigation_158.py
      - name: Run tests
        run: npm test
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Trasy 2.0 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add nav-map.js route-progress-core.js route-progress-style.js navigation-live-engine.js ptv-basemap.js map-day-night.js index.html sw.js test/
          git commit -m "Napraw przeskok na równoległą jezdnię i warstwy mapy [auto-patch]"
          git push
