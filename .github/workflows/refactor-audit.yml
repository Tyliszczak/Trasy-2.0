name: Refactor audit

on:
  push:
    branches: [audit/refactor-2.0.163]
    paths:
      - 'scripts/refactor_finalize.py'
      - 'scripts/refactor_tests_fix.py'
      - '.github/workflows/refactor-audit.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/refactor-2.0.163
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Zszyj moduły
        run: |
          python3 scripts/refactor_finalize.py
          python3 scripts/refactor_tests_fix.py
      - name: Testy przed zapisem
        run: npm test
      - name: Zapisz refaktor
        run: |
          git config user.name "Tyliszczak"
          git config user.email "kswiderski.de@gmail.com"
          git add -A
          git commit -m "Zszyj architekturę Trasy 2.0 po audycie"
          git push origin HEAD:audit/refactor-2.0.163
