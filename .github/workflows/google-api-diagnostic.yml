name: Google API diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/google-api-diagnostic.mjs'
      - '.github/workflows/google-api-diagnostic.yml'

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GAS_URL: https://script.google.com/macros/s/AKfycbyQcnU6xvvrUZNVUJRhQ293L47hZwlvsc6i3n9s9hiYqhLUAoKSqGbPohe_lSB0apfUcw/exec
      APP_URL: https://trasy-2-0.pages.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Google API diagnostic
        run: node scripts/google-api-diagnostic.mjs
