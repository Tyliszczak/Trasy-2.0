name: Google API diagnostic

on:
  workflow_dispatch:

# Diagnostyka odpytuje działającą domenę produkcyjną, dlatego jest uruchamiana
# ręcznie dopiero po zakończonym wdrożeniu Cloudflare. Testy PR sprawdzają ten
# sam kontrakt statycznie i nie powinny porównywać nowego kodu ze starą produkcją.

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: https://trasy.tyli.pl
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Google API diagnostic
        run: node scripts/google-api-diagnostic.mjs
