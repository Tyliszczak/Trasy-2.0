# follow-up trigger
name: Apply stage 5 patch

on:
  push:
    branches:
      - audit-stage5-globals-routing

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit-stage5-globals-routing
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact patch
        run: node scripts/apply-stage5.mjs
      - name: Validate diff
        run: git diff --check
      - name: Run tests before commit
        run: npm test
      - name: Commit stage 5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google-routes-provider.js navigation-guidance-fix.js navigation-live-engine.js navigation-ui-controls.js nav-map.js test/audit-regressions.test.js index.html sw.js
          git commit -m "Implement stage 5 routing isolation"
          git push origin HEAD:audit-stage5-globals-routing
