name: Apply stage 5 patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'audit-stage5-globals-routing' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: audit-stage5-globals-routing
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact patch
        run: node scripts/apply-stage5.mjs
      - name: Validate diff
        run: git diff --check
      - name: Run tests before commit
        run: npm test
      - name: Commit stage 5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google-routes-provider.js nav-map.js test/audit-regressions.test.js
          git commit -m "Harden stage 5 request cancellation"
          git push origin HEAD:audit-stage5-globals-routing
