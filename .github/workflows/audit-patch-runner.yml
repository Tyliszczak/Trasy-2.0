name: Audit patch runner

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.issue.pull_request && github.event.comment.body == '/apply-audit'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=${{ github.event.issue.number }}
          HEAD_REF=$(gh api repos/${{ github.repository }}/pulls/$PR --jq .head.ref)
          HEAD_REPO=$(gh api repos/${{ github.repository }}/pulls/$PR --jq .head.repo.full_name)
          test "$HEAD_REPO" = "${{ github.repository }}"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply audit patch
        run: node scripts/apply-audit.mjs
      - name: Validate diff
        run: git diff --check
      - name: Run tests before commit
        run: npm test
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply guarded audit patch"
          git push origin HEAD:${{ steps.pr.outputs.head_ref }}
