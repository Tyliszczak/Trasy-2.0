name: Audit patch runner

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read
  issues: write

jobs:
  apply:
    if: github.event.issue.pull_request && github.event.comment.body == '/apply-audit'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR branch
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=${{ github.event.issue.number }}
          HEAD_REF=$(gh api repos/${{ github.repository }}/pulls/$PR --jq .head.ref)
          HEAD_REPO=$(gh api repos/${{ github.repository }}/pulls/$PR --jq .head.repo.full_name)
          test "$HEAD_REPO" = "${{ github.repository }}"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply audit patch
        id: patch
        run: |
          set -o pipefail
          node scripts/apply-audit.mjs 2>&1 | tee /tmp/audit.log
      - name: Validate diff
        id: diff
        run: |
          set -o pipefail
          git diff --check 2>&1 | tee -a /tmp/audit.log
      - name: Run tests before commit
        id: tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee -a /tmp/audit.log
      - name: Commit patch
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply guarded audit patch"
          git push origin HEAD:${{ steps.pr.outputs.head_ref }}
      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=${{ github.event.issue.number }}
          {
            echo "### Audit patch runner: ${{ job.status }}"
            echo
            echo '```text'
            if [ -f /tmp/audit.log ]; then tail -n 80 /tmp/audit.log; else echo "Brak logu patcha — błąd nastąpił przed jego uruchomieniem."; fi
            echo '```'
          } > /tmp/audit-comment.md
          gh pr comment "$PR" --repo "${{ github.repository }}" --body-file /tmp/audit-comment.md
