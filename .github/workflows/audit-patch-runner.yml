name: Audit patch runner

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: read
  issues: write

jobs:
  apply:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.user.login == 'Tyliszczak' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.title, 'Etap ')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply audit patch
        run: |
          set -o pipefail
          node scripts/apply-audit.mjs 2>&1 | tee /tmp/audit.log
      - name: Validate diff
        run: |
          set -o pipefail
          git diff --check 2>&1 | tee -a /tmp/audit.log
      - name: Run tests before commit
        run: |
          set -o pipefail
          npm test 2>&1 | tee -a /tmp/audit.log
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply guarded audit patch"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=${{ github.event.pull_request.number }}
          {
            echo "### Audit patch runner: ${{ job.status }}"
            echo
            echo '```text'
            if [ -f /tmp/audit.log ]; then tail -n 80 /tmp/audit.log; else echo "Brak logu patcha — błąd nastąpił przed jego uruchomieniem."; fi
            echo '```'
          } > /tmp/audit-comment.md
          gh pr comment "$PR" --repo "${{ github.repository }}" --body-file /tmp/audit-comment.md
