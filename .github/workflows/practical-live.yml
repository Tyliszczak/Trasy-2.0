name: Practical live tests
# Stały audyt produkcji Trasy 2.0 po wdrożeniu; finalny przebieg używa prawdziwego kliknięcia użytkownika.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  practical:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_URL: https://trasy.tyli.pl
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read expected version
        run: node -e "const fs=require('fs');const html=fs.readFileSync('index.html','utf8');const version=html.match(/data-version=['\"]([^'\"]+)/)?.[1];if(!version)process.exit(1);fs.appendFileSync(process.env.GITHUB_ENV,'EXPECTED_VERSION='+version+'\n')"
      - name: Wait for Cloudflare deployment
        run: |
          for attempt in {1..30}; do
            if curl -fsS "$TARGET_URL/?deploy=$GITHUB_SHA" | grep -q "data-version=\"$EXPECTED_VERSION\""; then
              exit 0
            fi
            sleep 10
          done
          echo "Cloudflare did not publish TEST $EXPECTED_VERSION in time"
          exit 1
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run practical production tests
        run: node scripts/practical-live.mjs
      - name: Upload practical report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: practical-live-results
          path: practical-results.json
          if-no-files-found: ignore
