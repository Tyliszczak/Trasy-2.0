name: Optimize map start

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-map-start.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch map startup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          nav=Path('nav-map.js')
          s=nav.read_text()
          a=s.index('  function posOnce(){')
          b=s.index('  function fmtDistance',a)
          r=(
              "  function cachedPosition(maxAgeMs=15000){\n"
              "    const position=window.__trasyGps?.current?.();\n"
              "    const age=Date.now()-Number(position?.timestamp||0);\n"
              "    return position&&age>=0&&age<=maxAgeMs?position:null;\n"
              "  }\n\n"
              "  function posOnce(){\n"
              "    const cached=cachedPosition();\n"
              "    if(cached){\n"
              "      window.__trasyGps?.refresh?.({restartWatch:false}).catch(()=>{});\n"
              "      return Promise.resolve(cached);\n"
              "    }\n\n"
              "    if(window.__trasyGps?.refresh){\n"
              "      return window.__trasyGps.refresh({restartWatch:false});\n"
              "    }\n\n"
              "    return new Promise(\n"
              "      (resolve,reject)=>\n"
              "        navigator.geolocation.getCurrentPosition(\n"
              "          resolve,\n"
              "          reject,\n"
              "          {\n"
              "            enableHighAccuracy:true,\n"
              "            timeout:12000,\n"
              "            maximumAge:3000\n"
              "          }\n"
              "        )\n"
              "    );\n"
              "  }\n\n"
          )
          nav.write_text(s[:a]+r+s[b:])

          hook=Path('maplibre-route-hook.js')
          s=hook.read_text()
          needle="  const PROXY_PREFIX='/ptv-map';\n"
          insert=(
              "  const PROXY_PREFIX='/ptv-map';\n\n"
              "  // Rozgrzej styl PTV zanim kierowca otworzy nawigację.\n"
              "  window.__trasyPtvStyleWarmup=fetch(PTV_STYLE,{cache:'force-cache',mode:'cors'}).catch(()=>null);\n"
          )
          if '__trasyPtvStyleWarmup' not in s:
              s=s.replace(needle,insert,1)
          hook.write_text(s)

          index=Path('index.html')
          s=index.read_text()
          s=s.replace('data-version="2.0.160"','data-version="2.0.161"',1)
          s=s.replace('>TEST 2.0.160<','>TEST 2.0.161<',1)
          s=s.replace('maplibre-route-hook.js?v=3','maplibre-route-hook.js?v=4',1)
          if 'rel="preconnect" href="https://vectormaps-resources.myptv.com"' not in s:
              s=s.replace('<title>Trasy 2.0</title>','<link rel="preconnect" href="https://vectormaps-resources.myptv.com" crossorigin><title>Trasy 2.0</title>',1)
          index.write_text(s)

          sw=Path('sw.js')
          s=sw.read_text().replace("const APP_VERSION='2.0.160';","const APP_VERSION='2.0.161';",1).replace("const CACHE_NAME='trasy-2.0-v194';","const CACHE_NAME='trasy-2.0-v195';",1)
          sw.write_text(s)

          Path('test/map-start-speed.test.js').write_text(
              "import test from 'node:test';\n"
              "import assert from 'node:assert/strict';\n"
              "import fs from 'node:fs';\n"
              "const read=path=>fs.readFileSync(new URL('../'+path,import.meta.url),'utf8');\n\n"
              "test('nawigacja używa świeżej pozycji GPS-hub bez czekania na kolejny fix',()=>{\n"
              "  const nav=read('nav-map.js');\n"
              "  assert.match(nav,/function cachedPosition\\(maxAgeMs=15000\\)/);\n"
              "  assert.match(nav,/__trasyGps\\?\\.current/);\n"
              "  assert.match(nav,/Promise\\.resolve\\(cached\\)/);\n"
              "});\n\n"
              "test('styl PTV jest rozgrzewany przed otwarciem mapy',()=>{\n"
              "  const hook=read('maplibre-route-hook.js');\n"
              "  const html=read('index.html');\n"
              "  assert.match(hook,/__trasyPtvStyleWarmup=fetch\\(PTV_STYLE/);\n"
              "  assert.match(hook,/cache:'force-cache'/);\n"
              "  assert.match(html,/rel=\"preconnect\" href=\"https:\\\/\\\/vectormaps-resources\\.myptv\\.com\"/);\n"
              "});\n"
          )

          Path('.github/workflows/optimize-map-start.yml').unlink()
          PY
      - name: Commit optimized startup
        shell: bash
        run: |
          git config user.name "Tyliszczak"
          git config user.email "kswiderski.de@gmail.com"
          git add -A
          git commit -m "Przyspiesz wyświetlenie mapy PTV"
          git push
